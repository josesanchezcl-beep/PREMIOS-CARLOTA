<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Premios Carlota">
<meta name="theme-color" content="#ff6a00">
<title>Premios Carlota</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#111;--mut:#6b6b76;--ac:#ff6a00;--ok:#1f9d55;--bd:#e2e2e8;--bt:#fff3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#1b1b1f;--tx:#f2f2f5;--mut:#9a9aa6;--bd:#2c2c33;--bt:#2a1d12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#1b1b1f;--tx:#f2f2f5;--mut:#9a9aa6;--bd:#2c2c33;--bt:#2a1d12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 12px 40px;max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 8px;z-index:5}
.tot{background:var(--ac);color:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.tot small{display:block;opacity:.85;font-size:13px}
.tot b{font-size:38px;line-height:1}
h2{font-size:15px;color:var(--mut);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.add{flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;color:var(--tx);font:inherit;min-height:64px}
.add:active{transform:scale(.98);background:var(--bt)}
.add .n{font-weight:600;font-size:16px}
.add .d{font-size:12px;color:var(--mut);margin-top:2px}
.add .p{font-size:13px;color:var(--ok);font-weight:600;margin-top:2px}
.cnt{font-size:30px;font-weight:700;min-width:44px;text-align:right}
.min{width:52px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font-size:26px}
.min:active{background:var(--bt)}
.bonus .add{border-color:var(--ac)}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;border:0;font:inherit;font-weight:600;font-size:16px;background:var(--ac);color:#fff}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.hist .h{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.hist .s{font-size:12px;color:var(--mut);margin-top:4px}
.hist .a{display:flex;gap:8px;margin-top:8px}
.hist button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:13px}
.paid{color:var(--ok)}
.sum{display:flex;gap:8px;margin-bottom:8px}
.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px}
.sum small{color:var(--mut);display:block;font-size:12px}
.sum b{font-size:22px}
.empty{color:var(--mut);font-size:14px;padding:6px 4px}
</style>
</head>
<body>
<header>
  <div class="tot"><div><small>Partido en curso</small><span id="nact">0 acciones</span></div><b id="tot">0,00 €</b></div>
</header>
<div id="st" style="font-size:12px;color:var(--mut);padding:0 4px 4px"></div>

<h2>Intentos</h2>
<div id="l1"></div>
<h2>Bonus por éxito</h2>
<div id="l2" class="bonus"></div>

<div class="acts">
  <button class="btn sec" id="rst">Poner a cero</button>
  <button class="btn" id="end">Cerrar partido</button>
</div>

<div class="acts"><button class="btn sec" id="cp">Copiar resumen</button></div>
<textarea id="sm" readonly style="display:none;width:100%;height:160px;margin-top:8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px;font:13px monospace"></textarea>
<h2>Historial</h2>
<div class="sum"><div><small>Total acumulado</small><b id="sall">0,00 €</b></div><div><small>Pendiente de pagar</small><b id="spend">0,00 €</b></div></div>
<div id="hist"></div>

<script>
var ITEMS=[
 {id:"pase",n:"Pase a una compañera",d:"Conectar y mover el balón",p:0.10,g:1},
 {id:"step",n:"Intento de Step Back",d:"Con o sin éxito en el tiro",p:0.10,g:1},
 {id:"trip",n:"Intento de triple",d:"Entre o no entre",p:0.20,g:1},
 {id:"bloq",n:"Bloqueo al atacante",d:"Defender firme, obligar a pasar",p:0.10,g:1},
 {id:"tapo",n:"Tapón o intento claro",d:"Saltar e intimidar el tiro",p:0.20,g:1},
 {id:"t3s",n:"Triple CON Step Back",d:"Acierto de máxima dificultad",p:1.00,g:2},
 {id:"t3",n:"Triple SIN Step Back",d:"Lanzamiento exterior convertido",p:0.50,g:2},
 {id:"evit",n:"Evitar canasta rival",d:"Tapón efectivo o rebote defensivo clave",p:0.50,g:2}
];
var K1="premios_carlota_actual",K2="premios_carlota_hist";
var cur={},hist=[];
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function st(t){var e=document.getElementById("st");if(e)e.textContent=t}
window.onerror=function(m){st("Error: "+m)};
var dirty=false,ref=null;
function sync(){dirty=true;if(!ref)return;try{ref.set({cur:cur,hist:hist}).then(function(){st("Guardado en la nube ✓")},function(){st("No se pudo guardar en la nube")})}catch(e){st("No se pudo guardar en la nube")}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}sync()}
cur=load(K1,{});hist=load(K2,[]);dirty=false;
st("Guardado solo en este móvil");
function eur(x){return x.toFixed(2).replace(".",",")+" €"}
function total(c){var t=0;ITEMS.forEach(function(i){t+=(c[i.id]||0)*i.p});return Math.round(t*100)/100}
function ask(b,fn){if(b.dataset.arm){clearTimeout(+b.dataset.arm);delete b.dataset.arm;b.textContent=b.dataset.o;fn();return}b.dataset.o=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.dataset.arm=setTimeout(function(){b.textContent=b.dataset.o;delete b.dataset.arm},3000)}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}}
function build(){
  [1,2].forEach(function(g){
    var el=document.getElementById("l"+g);el.innerHTML="";
    ITEMS.filter(function(i){return i.g===g}).forEach(function(i){
      var r=document.createElement("div");r.className="row";
      r.innerHTML='<button class="add" data-a="'+i.id+'"><span><div class="n">'+i.n+'</div><div class="d">'+i.d+'</div><div class="p">+ '+eur(i.p)+'</div></span><span class="cnt" id="c_'+i.id+'">0</span></button><button class="min" data-m="'+i.id+'" aria-label="Restar">−</button>';
      el.appendChild(r);
    });
  });
}
function render(){
  var n=0;
  ITEMS.forEach(function(i){var v=cur[i.id]||0;n+=v;document.getElementById("c_"+i.id).textContent=v});
  document.getElementById("tot").textContent=eur(total(cur));
  document.getElementById("nact").textContent=n+(n===1?" acción":" acciones");
  var h=document.getElementById("hist");h.innerHTML="";
  var all=0,pend=0;
  hist.forEach(function(x){all+=x.t;if(!x.paid)pend+=x.t});
  document.getElementById("sall").textContent=eur(all);
  document.getElementById("spend").textContent=eur(pend);
  if(!hist.length){h.innerHTML='<div class="empty">Aún no hay partidos guardados.</div>';return}
  hist.slice().reverse().forEach(function(x,ri){
    var idx=hist.length-1-ri;
    var det=ITEMS.filter(function(i){return x.c[i.id]}).map(function(i){return x.c[i.id]+"× "+i.n}).join(" · ");
    var d=document.createElement("div");d.className="hist";
    d.innerHTML='<div class="h"><span>'+x.f+'</span><span class="'+(x.paid?"paid":"")+'">'+eur(x.t)+(x.paid?" ✓":"")+'</span></div><div class="s">'+(det||"Sin acciones")+'</div><div class="a"><button data-p="'+idx+'">'+(x.paid?"Marcar pendiente":"Marcar pagado")+'</button><button data-x="'+idx+'">Borrar</button></div>';
    h.appendChild(d);
  });
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.a){cur[b.dataset.a]=(cur[b.dataset.a]||0)+1;buzz();save(K1,cur);render()}
  else if(b.dataset.m){if((cur[b.dataset.m]||0)>0){cur[b.dataset.m]--;save(K1,cur);render()}}
  else if(b.dataset.p){var x=hist[+b.dataset.p];x.paid=!x.paid;save(K2,hist);render()}
  else if(b.dataset.x){var xi=+b.dataset.x;ask(b,function(){hist.splice(xi,1);save(K2,hist);render()})}
});
document.getElementById("rst").onclick=function(){ask(this,function(){cur={};save(K1,cur);render()})};
document.getElementById("end").onclick=function(){
  var t=total(cur);
  if(!Object.keys(cur).some(function(k){return cur[k]>0})){return}
  var f=new Date().toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  hist.push({f:f,c:cur,t:t,paid:false});cur={};save(K1,cur);save(K2,hist);render();
};
document.getElementById("cp").onclick=function(){
  var t="PREMIOS CARLOTA\n";
  var cu=total(cur);
  if(cu>0){t+="\nPartido en curso: "+eur(cu)+"\n"}
  hist.forEach(function(x){t+="\n"+x.f+": "+eur(x.t)+(x.paid?" (pagado)":" (pendiente)")+"\n"+ITEMS.filter(function(i){return x.c[i.id]}).map(function(i){return "  "+x.c[i.id]+"x "+i.n}).join("\n")+"\n"});
  var pend=0;hist.forEach(function(x){if(!x.paid)pend+=x.t});
  t+="\nPENDIENTE DE PAGAR: "+eur(pend);
  var s=document.getElementById("sm");s.value=t;s.style.display="block";s.focus();s.select();
  try{if(navigator.clipboard)navigator.clipboard.writeText(t);else document.execCommand("copy")}catch(e){}
};
build();render();
</script>
</body>
</html>
